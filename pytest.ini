[pytest]
# Configuración de pytest

# Directorio de pruebas
testpaths = tests

# Patrón de nombres de archivo de pruebas
python_files = test_*.py

# Patrón de nombres de clase de pruebas
python_classes = Test*

# Patrón de nombres de función de pruebas
python_functions = test_*

# Modo verbose por defecto
addopts = -v --tb=short

# Mostrar los 10 tests más lentos
durations = 10

# Marker para pruebas largas
markers =
    slow: marca pruebas como lentas (deseleccionar con '-m "not slow"')
    integration: marca pruebas de integración
    unit: marca pruebas unitarias
